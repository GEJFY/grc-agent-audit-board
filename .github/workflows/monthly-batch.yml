name: monthly-edinet-batch
on:
  schedule:
    - cron: "0 21 5 * *"   # 毎月6日 6:00 JST(前月分を収集。有報集中月=7月は処理量大)
  workflow_dispatch:
    inputs:
      year: { description: "対象年", required: false }
      month: { description: "対象月", required: false }

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r batch/requirements.txt
      - name: Run tests
        run: cd batch && python -m pytest tests/ -q
      - name: Collect & structure
        working-directory: batch
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.year }}" ]; then ARGS="--year ${{ inputs.year }} --month ${{ inputs.month }}"; fi
          python -m src.main $ARGS
